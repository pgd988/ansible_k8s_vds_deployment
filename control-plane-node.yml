---
- name: Deploy RKE2 Kubernetes Control Plane Node
  hosts: control_plane
  vars_files:
    - vars.yml
  tasks:
    - name: Include common setup tasks
      include_tasks: common-tasks.yml

    - name: Create RKE2 server manifests directory
      file:
        path: /var/lib/rancher/rke2/server/manifests
        state: directory
        mode: '0755'
      become: yes

    - name: Configure Cilium CNI with WireGuard encryption via HelmChartConfig
      copy:
        dest: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
        content: |
          ---
          apiVersion: helm.cattle.io/v1
          kind: HelmChartConfig
          metadata:
            name: rke2-cilium
            namespace: kube-system
          spec:
            valuesContent: |-
              encryption:
                enabled: true
                type: wireguard
      become: yes
      when: rke2_cni == 'cilium' and rke2_cilium_wireguard | default(false) | bool

    - name: Create RKE2 config.yaml for control plane
      copy:
        dest: /etc/rancher/rke2/config.yaml
        content: |
          write-kubeconfig-mode: "0644"
          cni: "{{ rke2_cni }}"
          bind-address: "{{ apiserver_advertise_address }}"
          advertise-address: "{{ apiserver_advertise_address }}"
          cluster-cidr: "{{ pod_network_cidr }}"
          service-cidr: "{{ service_network_cidr }}"
          cluster-domain: "{{ cluster_domain }}"
      become: yes

    - name: Install RKE2 Server
      environment:
        INSTALL_RKE2_TYPE: server
        INSTALL_RKE2_CHANNEL: "{{ rke2_channel }}"
      command: /usr/local/bin/rke2-install.sh
      args:
        creates: /etc/systemd/system/rke2-server.service
      become: yes

    - name: Enable and start rke2-server service
      systemd:
        name: rke2-server
        daemon_reload: yes
        enabled: yes
        state: started
      become: yes

    - name: Wait for RKE2 node-token file to be generated
      wait_for:
        path: /var/lib/rancher/rke2/server/node-token
        timeout: 300
      become: yes

    - name: Wait for RKE2 kubeconfig to be generated
      wait_for:
        path: /etc/rancher/rke2/rke2.yaml
        timeout: 300
      become: yes

    - name: Create symlink for kubectl
      file:
        src: /var/lib/rancher/rke2/bin/kubectl
        dest: /usr/local/bin/kubectl
        state: link
      become: yes

    - name: Create symlink for crictl
      file:
        src: /var/lib/rancher/rke2/bin/crictl
        dest: /usr/local/bin/crictl
        state: link
      become: yes

    - name: Create .kube directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      become: yes

    - name: Copy RKE2 kubeconfig to ubuntu user home
      copy:
        src: /etc/rancher/rke2/rke2.yaml
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      become: yes

    - name: Create .kube directory for root user
      file:
        path: /root/.kube
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: yes

    - name: Copy RKE2 kubeconfig to root user home
      copy:
        src: /etc/rancher/rke2/rke2.yaml
        dest: /root/.kube/config
        remote_src: yes
        owner: root
        group: root
        mode: '0600'
      become: yes

    - name: Configure crictl runtime endpoint
      command: crictl config runtime-endpoint unix:///run/k3s/containerd/containerd.sock
      become: yes
      ignore_errors: yes

    - name: Read RKE2 node token
      slurp:
        src: /var/lib/rancher/rke2/server/node-token
      register: rke2_token_slurp
      become: yes

    - name: Save RKE2 node token locally for workers
      copy:
        content: "{{ rke2_token_slurp.content | b64decode | trim }}"
        dest: rke2_node_token.txt
      delegate_to: localhost
      become: no

    - name: Include Rancher Management Server deployment tasks
      include_tasks: rancher-server.yml
      when: install_rancher_server | default(true) | bool

    - name: Include Cloudflare Tunnel and Ingress Routing tasks
      include_tasks: cloudflare-tunnel.yml
      when: install_cloudflare_tunnel | default(false) | bool

    - name: Include MetalLB Bare-Metal LoadBalancer deployment tasks
      include_tasks: metallb.yml
      when: install_metallb | default(false) | bool
