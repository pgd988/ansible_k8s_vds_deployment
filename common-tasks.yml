---
- name: Disable swap
  command: swapoff -a
  become: yes

- name: Disable swap in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'
  become: yes

- name: Load overlay, br_netfilter, and wireguard kernel modules
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
      wireguard
  become: yes

- name: Modprobe overlay
  modprobe:
    name: overlay
  become: yes

- name: Modprobe br_netfilter
  modprobe:
    name: br_netfilter
  become: yes

- name: Modprobe wireguard
  modprobe:
    name: wireguard
  become: yes
  ignore_errors: yes

- name: Configure sysctl parameters for Kubernetes and Cilium networking
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  become: yes

- name: Apply sysctl params without reboot
  command: sysctl --system
  become: yes

- name: Update apt cache and install base dependencies and WireGuard tools
  apt:
    name:
      - curl
      - ca-certificates
      - tar
      - wireguard
      - wireguard-tools
      - iptables
    state: present
    update_cache: yes
  become: yes

- name: Create RKE2 configuration directory
  file:
    path: /etc/rancher/rke2
    state: directory
    mode: '0755'
  become: yes

- name: Create RKE2 data directory
  file:
    path: /var/lib/rancher/rke2
    state: directory
    mode: '0755'
  become: yes

- name: Download official RKE2 installation script
  get_url:
    url: https://get.rke2.io
    dest: /usr/local/bin/rke2-install.sh
    mode: '0755'
  become: yes
